<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хто має більше число</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      color: #fff;
      text-align: center;
    }
    .circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .row {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #333;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background-color: #555; }
    #message { margin-top: 15px; font-size: 18px; }
  </style>
</head>
<body>
  <script>
    let userScore = 0;
    let compScore = 0;

    const userDiv = document.createElement('div');
    const compDiv = document.createElement('div');
    const scoreDiv = document.createElement('div');
    const messageDiv = document.createElement('div');
    const playBtn = document.createElement('button');
    const resetBtn = document.createElement('button');

    const userCircle = document.createElement('div');
    const compCircle = document.createElement('div');

    userCircle.className = 'circle';
    compCircle.className = 'circle';

    const row = document.createElement('div');
    row.className = 'row';
    row.append(userCircle, compCircle);

    playBtn.textContent = 'Грати';
    resetBtn.textContent = 'Скинути';

    document.body.append(row, userDiv, compDiv, scoreDiv, playBtn, resetBtn, messageDiv);

    function updateUI() {
      userDiv.textContent = `Гравець: ${userScore}`;
      compDiv.textContent = `Комп'ютер: ${compScore}`;
      scoreDiv.textContent = 'Хто перший до 3 перемог!';
    }

    function playRound() {
      if (userScore >= 3 || compScore >= 3) return;

      const userNum = Math.floor(Math.random() * 100) + 1;
      const compNum = Math.floor(Math.random() * 100) + 1;

      userCircle.textContent = userNum;
      compCircle.textContent = compNum;

      let msg = `Гравець: ${userNum}, Комп'ютер: ${compNum}. `;

      if (userNum > compNum) {
        userScore++;
        msg += 'Гравець отримує бал!';
      } else if (compNum > userNum) {
        compScore++;
        msg += 'Комп’ютер отримує бал!';
      } else {
        msg += 'Нічия!';
      }

      updateUI();
      messageDiv.textContent = msg;

      if (userScore === 3 || compScore === 3) {
        messageDiv.textContent = (userScore === 3 ? 'Гравець переміг! 🎉' : 'Комп’ютер переміг! 🤖');
        playBtn.disabled = true;
      }
    }

    playBtn.onclick = playRound;
    resetBtn.onclick = () => {
      userScore = 0;
      compScore = 0;
      userCircle.textContent = '';
      compCircle.textContent = '';
      messageDiv.textContent = '';
      playBtn.disabled = false;
      updateUI();
    };

    updateUI();
  </script>
</body>
</html>
